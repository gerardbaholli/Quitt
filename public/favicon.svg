  <rect x="21" y="13" width="6" height="6" rx="1" fill="#2e3136"/>
  <!-- riga 3: da fare -->
  <rect x="5"  y="21" width="6" height="6" rx="1" fill="#2e3136"/>
  <rect x="13" y="21" width="6" height="6" rx="1" fill="#2e3136"/>
  <rect x="21" y="21" width="6" height="6" rx="1" fill="#2e3136"/>
