<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Quitt</title>
  <rect width="32" height="32" rx="7" fill="#111214"/>
  <!-- riga 1: minuti passati -->
  <rect x="5"  y="5"  width="6" height="6" rx="1" fill="#5b6069"/>
  <rect x="13" y="5"  width="6" height="6" rx="1" fill="#5b6069"/>
  <rect x="21" y="5"  width="6" height="6" rx="1" fill="#5b6069"/>
  <!-- riga 2: passato, minuto in corso (riempito dal basso), da fare -->
